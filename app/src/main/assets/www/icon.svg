<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#1e293b" />
      <stop offset="100%" stopColor="#020617" />
    </radialGradient>
    <linearGradient id="batteryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ef4444" />
      <stop offset="40%" stopColor="#dc2626" />
      <stop offset="100%" stopColor="#7f1d1d" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#334155" />
      <stop offset="100%" stopColor="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" />
  <rect width="512" height="512" rx="110" stroke="#dc2626" stroke-width="6" stroke-opacity="0.4" fill="none" />

  <!-- Battery Terminal Left (-) -->
  <rect x="175" y="150" width="26" height="20" rx="4" fill="#64748b" />
  <rect x="180" y="140" width="16" height="12" rx="3" fill="#cbd5e1" />

  <!-- Battery Terminal Right (+) -->
  <rect x="311" y="150" width="26" height="20" rx="4" fill="#64748b" />
  <rect x="316" y="140" width="16" height="12" rx="3" fill="#cbd5e1" />

  <!-- Main Red Metallic Battery Case -->
  <path d="M 160 178 C 160 170 166 164 174 164 L 205 164 L 215 152 L 297 152 L 307 164 L 338 164 C 346 164 352 170 352 178 L 352 300 C 352 308 346 314 338 314 L 174 314 C 166 314 160 308 160 300 Z" fill="url(#batteryGrad)" stroke="#991b1b" stroke-width="4" />

  <!-- Battery Charge Indicator on Front -->
  <rect x="210" y="224" width="86" height="40" rx="8" fill="#0f172a" stroke="#f8fafc" stroke-width="3" />
  <rect x="296" y="234" width="7" height="20" rx="3" fill="#f8fafc" />
  <rect x="218" y="232" width="10" height="24" rx="2" fill="#ffffff" />
  <rect x="232" y="232" width="10" height="24" rx="2" fill="#ffffff" />
  <rect x="246" y="232" width="10" height="24" rx="2" fill="#ffffff" />
  <rect x="260" y="232" width="10" height="24" rx="2" fill="#ffffff" />
  <rect x="274" y="232" width="10" height="24" rx="2" fill="#4ade80" />

  <!-- Plus (+) symbol -->
  <path d="M 315 204 L 315 220 M 307 212 L 323 212" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  <!-- Minus (-) symbol -->
  <path d="M 185 212 L 201 212" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />

  <!-- Lightning Bolts Glowing -->
  <g filter="url(#glow)">
    <path d="M 230 145 L 216 105 L 232 109 L 218 70 L 244 112 L 230 110 Z" fill="#ff2222" stroke="#ffffff" stroke-width="2" />
    <path d="M 278 145 L 264 105 L 280 109 L 266 70 L 292 112 L 278 110 Z" fill="#ff2222" stroke="#ffffff" stroke-width="2" />
  </g>

  <!-- Sweeping Ascending 3D Dark Metallic Arrow -->
  <path d="M 148 290 C 125 260 150 220 190 232 C 158 252 150 288 190 316 C 242 352 310 304 366 182 L 378 192 L 376 118 L 314 150 L 328 162 C 278 266 212 318 148 290 Z" fill="url(#arrowGrad)" stroke="#475569" stroke-width="3" />

  <!-- Brand Typography -->
  <text x="256" y="380" font-family="'Rajdhani', sans-serif" font-weight="900" font-size="42" fill="#ffffff" text-anchor="middle" letter-spacing="3">OM SAI RAM</text>
  <text x="256" y="420" font-family="'Rajdhani', sans-serif" font-weight="900" font-size="34" fill="#ef4444" text-anchor="middle" letter-spacing="4">ELECTRICALS</text>
  <line x1="156" y1="434" x2="356" y2="434" stroke="#dc2626" stroke-width="4" stroke-linecap="round" />
  <text x="256" y="458" font-family="sans-serif" font-weight="700" font-size="16" fill="#94a3b8" text-anchor="middle" letter-spacing="5">POWERING YOUR HOME</text>
</svg>
