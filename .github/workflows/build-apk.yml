name: Build and Release Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify active Java version
        run: java -version

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="v${{ github.run_number }}.${{ github.run_attempt }}"
          RELEASE_TITLE="Release ${RELEASE_TAG}"
          ASSET_NAME="app-debug-${RELEASE_TAG}.apk"

          # Prepare release asset with clean naming
          cp app/build/outputs/apk/debug/app-debug.apk "${ASSET_NAME}"

          # Construct release notes body
          RELEASE_BODY=$(cat <<EOF
          ### Release Information
          - **Commit SHA**: \`${{ github.sha }}\`
          - **Notice**: The APK is intended for testing.
          - **Distribution Notice**: The APK is not a Play Store production release.
          - **Signing Notice**: The APK is signed only with a temporary debug keystore.
          EOF
          )

          gh release create "${RELEASE_TAG}" "${ASSET_NAME}" \
            --target "${{ github.sha }}" \
            --title "${RELEASE_TITLE}" \
            --notes "${RELEASE_BODY}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="v${{ github.run_number }}.${{ github.run_attempt }}"
          ASSET_NAME="app-debug-${RELEASE_TAG}.apk"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "========================================="
            echo "GitHub Release Publishing Succeeded"
            echo "========================================="
            gh release view "${RELEASE_TAG}"
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: Release ${RELEASE_TAG}"
            RELEASE_URL=$(gh release view "${RELEASE_TAG}" --json url -q .url)
            echo "Direct GitHub Release URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${ASSET_NAME}"

            {
              echo "### 🚀 APK Release Ready"
              echo ""
              echo "The debug APK has been published to GitHub Releases:"
              echo "- **Release Page**: [${RELEASE_TAG}](${RELEASE_URL})"
              echo "- **Direct APK Asset**: \`${ASSET_NAME}\` (downloadable from the release **Assets** section)"
              echo ""
              echo "> ℹ️ **Backup Available**: The standard Actions artifact named \`app-debug-apk\` is also available for download in this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not complete successfully."
            echo "The APK build succeeded, and the Actions artifact named 'app-debug-apk' remains available."

            {
              echo "### ⚠️ Release Publishing Warning"
              echo ""
              echo "> **Notice**: GitHub Release publishing failed or was skipped, but the **APK build completed successfully**."
              echo ""
              echo "The verified APK is available as a GitHub Actions artifact:"
              echo "- **Artifact Name**: \`app-debug-apk\`"
              echo "- **Download**: Check the Summary page of this workflow execution under **Artifacts** to download \`app-debug-apk\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
